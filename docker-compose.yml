services:
  # ── Postgres ─────────────────────────────────────────────────────────────
  # Default: always starts.
  # Local dev: run only postgres here, then `go run ./cmd/api` in the shell.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: courtscore
      POSTGRES_PASSWORD: courtscore
      POSTGRES_DB: courtscore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtscore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API (optional, profile=full) ─────────────────────────────────────────
  # Use for running everything in Docker:
  #   docker compose --profile full up --build
  api:
    profiles: ["full"]
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://courtscore:courtscore@postgres:5432/courtscore?sslmode=disable
    env_file:
      - path: .env
        required: false      # ok to skip .env when all vars are set above
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
