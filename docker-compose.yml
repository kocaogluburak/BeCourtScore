services:
  # ── Postgres ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: courtscore_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: courtscore
      POSTGRES_PASSWORD: courtscore
      POSTGRES_DB: courtscore
    ports:
      # Sadece sunucu içinden (localhost) erişilebilir, dış internete kapalı
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 350M # 1 GB RAM sunucuyu korumak için sınır
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtscore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: courtscore_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://courtscore:courtscore@postgres:5432/courtscore?sslmode=disable
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 250M # Go API için oldukça cömert bir sınır
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data: